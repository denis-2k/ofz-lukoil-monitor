<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>T-Invest стакан</title>
  <style>
    body{margin:0;background:#f4f6f8;color:#17202a;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{background:#16202d;color:white;padding:20px 24px}main{width:min(980px,calc(100% - 28px));margin:16px auto}.panel,.card{background:#fff;border:1px solid #d8e0e8;border-radius:8px}.panel{padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{padding:14px}.muted{color:#657184}.metric{font-size:28px;font-weight:750;margin:4px 0}.tag{display:inline-flex;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:750}.good{background:#e8f6ef;color:#0b7f57}.watch{background:#eaf2ff;color:#2563eb}.wait{background:#fff4db;color:#a26313}.bad{background:#fff0ef;color:#bf3530}table{width:100%;border-collapse:collapse}td,th{padding:9px 8px;border-bottom:1px solid #d8e0e8;text-align:left}th{background:#f8fafc;color:#657184;font-size:12px;text-transform:uppercase}@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><h1>T-Invest стакан</h1><div class="muted">ЛУКОЙЛ ЗО-31 и ОФЗ 26247. Данные из market_state.json, обновление GitHub Actions.</div></header>
<main>
  <section class="panel"><button onclick="load()">Обновить</button> <span class="muted" id="updated">Загрузка...</span></section>
  <section class="panel"><h2>Сигнал</h2><div id="signal"></div></section>
  <section class="grid" id="cards"></section>
  <section class="panel"><h2>ЛУКОЙЛ ЗО-31</h2><table><thead><tr><th>Покупка bid</th><th>Продажа ask</th></tr></thead><tbody id="lukoilRows"></tbody></table></section>
  <section class="panel"><h2>ОФЗ 26247</h2><table><thead><tr><th>Покупка bid</th><th>Продажа ask</th></tr></thead><tbody id="ofzRows"></tbody></table></section>
</main>
<script>
const f=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:4});
function q(x){return x?`${f.format(x.price)}% x ${x.quantity}`:'-'}
function moneySignal(l){
  if(!l||!l.best_ask||!l.best_bid) return ['wait','Мало данных','В стакане нет bid/ask для расчёта спреда.'];
  if(l.spread_pct>1.5||l.best_ask.price>87) return ['bad','Не покупать по рынку',`Спред ${f.format(l.spread_pct)}%, ask ${f.format(l.best_ask.price)}%. Нужна лимитная заявка ниже рынка.`];
  if(l.spread_pct<=0.5&&l.best_ask.price<=86) return ['good','Стакан нормальный',`Спред ${f.format(l.spread_pct)}%, ask ${f.format(l.best_ask.price)}%. Можно работать лимиткой.`];
  return ['watch','Наблюдать',`Спред ${f.format(l.spread_pct)}%, ask ${f.format(l.best_ask.price)}%. Только лимиткой.`];
}
function rows(inst){
  const bids=inst?.bids||[], asks=inst?.asks||[], n=Math.max(bids.length,asks.length,1);
  return Array.from({length:n},(_,i)=>`<tr><td>${q(bids[i])}</td><td>${q(asks[i])}</td></tr>`).join('');
}
async function load(){
  try{
    const r=await fetch(`market_state.json?_=${Date.now()}`,{cache:'no-store'}); if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const s=await r.json(); const l=s.instruments?.lukoil_zo31, o=s.instruments?.ofz_26247;
    document.getElementById('updated').textContent=`Обновлено: ${s.updated_at||'-'}`;
    const [cls,label,text]=moneySignal(l);
    document.getElementById('signal').innerHTML=`<span class="tag ${cls}">${label}</span><p>${text}</p>`;
    document.getElementById('cards').innerHTML=`<article class="card"><div class="muted">ЛУКОЙЛ best bid</div><div class="metric">${l?.best_bid?f.format(l.best_bid.price)+'%':'-'}</div><div class="muted">${l?.best_bid?.quantity||'-'} шт.</div></article><article class="card"><div class="muted">ЛУКОЙЛ best ask</div><div class="metric">${l?.best_ask?f.format(l.best_ask.price)+'%':'-'}</div><div class="muted">${l?.best_ask?.quantity||'-'} шт.</div></article><article class="card"><div class="muted">Спред</div><div class="metric">${l?.spread_pct!=null?f.format(l.spread_pct)+'%':'-'}</div><div class="muted">ask-bid</div></article><article class="card"><div class="muted">ОФЗ best ask</div><div class="metric">${o?.best_ask?f.format(o.best_ask.price)+'%':'-'}</div><div class="muted">${o?.best_ask?.quantity||'-'} шт.</div></article>`;
    document.getElementById('lukoilRows').innerHTML=rows(l); document.getElementById('ofzRows').innerHTML=rows(o);
  }catch(e){document.getElementById('updated').textContent=`Ошибка: ${e.message}`;}
}
load(); setInterval(load,60000);
</script>
</body>
</html>
