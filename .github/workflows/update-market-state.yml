name: Update market state

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt --index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple

      - name: Export market state
        env:
          T_INVEST_TOKEN: ${{ secrets.T_INVEST_TOKEN }}
        run: python scripts/export_market_state.py

      - name: Commit market state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_state.json tbank_ca_bundle.pem
          git diff --cached --quiet && exit 0
          git commit -m "Update market state"
          git push
